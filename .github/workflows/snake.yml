name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#67E8F9&color_dots=#1b2230,#065f46,#047857,#059669,#10b981
            dist/snake-light.svg?palette=github-light&color_snake=#164E63&color_dots=#ebedf0,#a7f3d0,#6ee7b7,#10b981,#059669

      - name: Tighten snake SVGs (trim padding, drop progress bar)
        run: |
          for f in dist/snake-dark.svg dist/snake-light.svg; do
            sed -i -E 's/viewBox="-16 -32 880 192" width="880" height="192"/viewBox="-2 -18 852 134" width="852" height="134"/; s#<rect class="u u[0-9]+"[^>]*/>##g' "$f"
          done

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}