<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="hd-t">
  <title id="hd-t">Mohammad Mahtab, Full Stack Developer</title>
  <defs>
    <linearGradient id="hd-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="hd-wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <clipPath id="hd-k1"><rect class="hd-c1" x="-53.6" y="150" width="302.4" height="44"/></clipPath>
    <clipPath id="hd-k2"><rect class="hd-c2" x="-248" y="150" width="432" height="44"/></clipPath>
    <clipPath id="hd-k3"><rect class="hd-c3" x="-356" y="150" width="504" height="44"/></clipPath>
  </defs>
  <style>
    .hd-sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .hd-mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:24px}
    .hd-name{font-size:56px;font-weight:700;fill:url(#hd-accent)}
    .hd-role{font-size:24px;font-weight:500;fill:#8B949E}
    .hd-type{fill:#E6EDF3}
    .hd-cur{fill:#22D3EE}
    .hd-wv{fill:none;stroke:url(#hd-wave);stroke-linecap:round}
    .hd-c1{transform:translateX(302.4px)}
    .hd-c2,.hd-c3{transform:translateX(0)}
    .hd-v1,.hd-v2,.hd-v3{opacity:0}

    @media (prefers-reduced-motion:no-preference){
      .hd-c1,.hd-q1{animation:hd-t1 12s linear infinite}
      .hd-c2,.hd-q2{animation:hd-t2 12s linear infinite}
      .hd-c3,.hd-q3{animation:hd-t3 12s linear infinite}
      .hd-v1{animation:hd-v1 12s linear infinite}
      .hd-v2{animation:hd-v2 12s linear infinite}
      .hd-v3{animation:hd-v3 12s linear infinite}
      .hd-bl{animation:hd-blink 1s steps(1,end) infinite}
      .hd-w1{animation:hd-drift1 22s linear infinite}
      .hd-w2{animation:hd-drift2 30s linear infinite}
    }

    @keyframes hd-t1{
      0%,1%{transform:translateX(0);animation-timing-function:steps(21,end)}
      14%{transform:translateX(302.4px)}
      25%{transform:translateX(302.4px);animation-timing-function:steps(21,end)}
      31%{transform:translateX(0)}
      100%{transform:translateX(0)}
    }
    @keyframes hd-t2{
      0%,34.33%{transform:translateX(0);animation-timing-function:steps(30,end)}
      47.33%{transform:translateX(432px)}
      58.33%{transform:translateX(432px);animation-timing-function:steps(30,end)}
      64.33%{transform:translateX(0)}
      100%{transform:translateX(0)}
    }
    @keyframes hd-t3{
      0%,67.67%{transform:translateX(0);animation-timing-function:steps(35,end)}
      80.67%{transform:translateX(504px)}
      91.67%{transform:translateX(504px);animation-timing-function:steps(35,end)}
      97.67%{transform:translateX(0)}
      100%{transform:translateX(0)}
    }
    @keyframes hd-v1{0%{opacity:1}33.3%{opacity:1}33.31%{opacity:0}100%{opacity:0}}
    @keyframes hd-v2{0%{opacity:0}33.3%{opacity:0}33.31%{opacity:1}66.6%{opacity:1}66.61%{opacity:0}100%{opacity:0}}
    @keyframes hd-v3{0%{opacity:0}66.6%{opacity:0}66.61%{opacity:1}100%{opacity:1}}
    @keyframes hd-blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
    @keyframes hd-drift1{from{transform:translateX(0)}to{transform:translateX(-400px)}}
    @keyframes hd-drift2{from{transform:translateX(-400px)}to{transform:translateX(0)}}
  </style>

  <text class="hd-sans hd-name" x="400" y="92" text-anchor="middle">Mohammad Mahtab</text>
  <text class="hd-sans hd-role" x="400" y="132" text-anchor="middle">Full Stack Developer</text>

  <text class="hd-mono hd-type" x="248.8" y="182" textLength="302.4" lengthAdjust="spacing" clip-path="url(#hd-k1)">PHP &#183; Laravel &#183; MySQL</text>
  <text class="hd-mono hd-type" x="184" y="182" textLength="432" lengthAdjust="spacing" clip-path="url(#hd-k2)">JavaScript &#183; React &#183; Bootstrap</text>
  <text class="hd-mono hd-type" x="148" y="182" textLength="504" lengthAdjust="spacing" clip-path="url(#hd-k3)">Business websites &#183; CRMs &#183; Web apps</text>

  <g class="hd-v1"><g class="hd-bl"><rect class="hd-cur hd-q1" x="248.8" y="158" width="2.5" height="28" rx="1"/></g></g>
  <g class="hd-v2"><g class="hd-bl"><rect class="hd-cur hd-q2" x="184" y="158" width="2.5" height="28" rx="1"/></g></g>
  <g class="hd-v3"><g class="hd-bl"><rect class="hd-cur hd-q3" x="148" y="158" width="2.5" height="28" rx="1"/></g></g>

  <path class="hd-wv hd-w1" stroke-width="2" stroke-opacity=".35" d="M-400 214Q-300 198 -200 214T0 214T200 214T400 214T600 214T800 214T1000 214T1200 214"/>
  <path class="hd-wv hd-w2" stroke-width="1.5" stroke-opacity=".18" d="M-400 220Q-300 232 -200 220T0 220T200 220T400 220T600 220T800 220T1000 220T1200 220"/>
</svg>