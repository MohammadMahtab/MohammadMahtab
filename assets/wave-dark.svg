<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="wf-t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="wf-t">Animated wave divider</title>
  <defs>
    <linearGradient id="wf-wa" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wf-wb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="wf-fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".14" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".86" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="wf-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="64">
      <rect x="0" y="0" width="720" height="64" fill="url(#wf-fg)"/>
    </mask>
  </defs>
  <style>
    .wf-wv{fill:none;stroke-linecap:round}
    @media (prefers-reduced-motion:no-preference){
      .wf-w1{animation:wf-drift1 22s linear infinite}
      .wf-w2{animation:wf-drift2 30s linear infinite}
    }
    @keyframes wf-drift1{from{transform:translateX(0)}to{transform:translateX(-400px)}}
    @keyframes wf-drift2{from{transform:translateX(-400px)}to{transform:translateX(0)}}
  </style>
  <g mask="url(#wf-fade)">
    <path class="wf-wv wf-w1" stroke="url(#wf-wa)" stroke-width="2" stroke-opacity=".6" d="M-400 26Q-300 10 -200 26T0 26T200 26T400 26T600 26T800 26T1000 26T1200 26"/>
    <path class="wf-wv wf-w2" stroke="url(#wf-wb)" stroke-width="1.5" stroke-opacity=".4" d="M-400 38Q-300 54 -200 38T0 38T200 38T400 38T600 38T800 38T1000 38T1200 38"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
