<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="hd-t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="hd-t">Mohammad Mahtab, Full Stack Developer</title>
  <defs>
    <linearGradient id="hd-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="hd-wa" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="hd-wb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hd-fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".14" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".86" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hd-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="220">
      <rect x="0" y="0" width="720" height="220" fill="url(#hd-fg)"/>
    </mask>
    <clipPath id="hd-k1"><rect class="hd-c1" x="-55.8" y="130" width="277.2" height="30"/></clipPath>
    <clipPath id="hd-k2"><rect class="hd-c2" x="-234.0" y="130" width="396.0" height="30"/></clipPath>
    <clipPath id="hd-k3"><rect class="hd-c3" x="-333.0" y="130" width="462.0" height="30"/></clipPath>
  </defs>
  <style>
    .hd-sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .hd-mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:22px}
    .hd-name{font-size:44px;font-weight:700;fill:url(#hd-accent)}
    .hd-role{font-size:22px;font-weight:500;fill:#59636E}
    .hd-type{fill:#1F2328}
    .hd-cur{fill:#0891B2}
    .hd-wv{fill:none;stroke-linecap:round}
    .hd-c1{transform:translateX(277.2px)}
    .hd-c2,.hd-c3{transform:translateX(0)}
    .hd-v1,.hd-v2,.hd-v3{opacity:0}

    @media (max-width:520px){
      .hd-gn{transform:translate(360px,66px) scale(1.35) translate(-360px,-66px)}
      .hd-gr{transform:translate(360px,104px) scale(1.4) translate(-360px,-104px)}
      .hd-gt{transform:translate(360px,152px) scale(1.3) translate(-360px,-152px)}
    }

    @media (prefers-reduced-motion:no-preference){
      .hd-c1,.hd-q1{animation:hd-t1 12s linear infinite}
      .hd-c2,.hd-q2{animation:hd-t2 12s linear infinite}
      .hd-c3,.hd-q3{animation:hd-t3 12s linear infinite}
      .hd-v1{animation:hd-v1 12s linear infinite}
      .hd-v2{animation:hd-v2 12s linear infinite}
      .hd-v3{animation:hd-v3 12s linear infinite}
      .hd-bl{animation:hd-blink 1s steps(1,end) infinite}
      .hd-w1{animation:hd-drift1 22s linear infinite}
      .hd-w2{animation:hd-drift2 30s linear infinite}
    }

    @keyframes hd-t1{
      0%,1%{transform:translateX(0);animation-timing-function:steps(21,end)}
      14%{transform:translateX(277.2px)}
      25%{transform:translateX(277.2px);animation-timing-function:steps(21,end)}
      31%{transform:translateX(0)}
      100%{transform:translateX(0)}
    }
    @keyframes hd-t2{
      0%,34.33%{transform:translateX(0);animation-timing-function:steps(30,end)}
      47.33%{transform:translateX(396.0px)}
      58.33%{transform:translateX(396.0px);animation-timing-function:steps(30,end)}
      64.33%{transform:translateX(0)}
      100%{transform:translateX(0)}
    }
    @keyframes hd-t3{
      0%,67.67%{transform:translateX(0);animation-timing-function:steps(35,end)}
      80.67%{transform:translateX(462.0px)}
      91.67%{transform:translateX(462.0px);animation-timing-function:steps(35,end)}
      97.67%{transform:translateX(0)}
      100%{transform:translateX(0)}
    }
    @keyframes hd-v1{0%{opacity:1}33.3%{opacity:1}33.31%{opacity:0}100%{opacity:0}}
    @keyframes hd-v2{0%{opacity:0}33.3%{opacity:0}33.31%{opacity:1}66.6%{opacity:1}66.61%{opacity:0}100%{opacity:0}}
    @keyframes hd-v3{0%{opacity:0}66.6%{opacity:0}66.61%{opacity:1}100%{opacity:1}}
    @keyframes hd-blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
    @keyframes hd-drift1{from{transform:translateX(0)}to{transform:translateX(-400px)}}
    @keyframes hd-drift2{from{transform:translateX(-400px)}to{transform:translateX(0)}}
  </style>

  <g class="hd-gn"><text class="hd-sans hd-name" x="360" y="66" text-anchor="middle">Mohammad Mahtab</text></g>
  <g class="hd-gr"><text class="hd-sans hd-role" x="360" y="104" text-anchor="middle">Full Stack Developer</text></g>

  <g class="hd-gt">
    <text class="hd-mono hd-type" x="221.4" y="152" textLength="277.2" lengthAdjust="spacing" clip-path="url(#hd-k1)">PHP &#183; Laravel &#183; MySQL</text>
    <text class="hd-mono hd-type" x="162.0" y="152" textLength="396.0" lengthAdjust="spacing" clip-path="url(#hd-k2)">JavaScript &#183; React &#183; Bootstrap</text>
    <text class="hd-mono hd-type" x="129.0" y="152" textLength="462.0" lengthAdjust="spacing" clip-path="url(#hd-k3)">Business websites &#183; CRMs &#183; Web apps</text>
    <g class="hd-v1"><g class="hd-bl"><rect class="hd-cur hd-q1" x="221.4" y="133" width="2.5" height="24" rx="1"/></g></g>
    <g class="hd-v2"><g class="hd-bl"><rect class="hd-cur hd-q2" x="162.0" y="133" width="2.5" height="24" rx="1"/></g></g>
    <g class="hd-v3"><g class="hd-bl"><rect class="hd-cur hd-q3" x="129.0" y="133" width="2.5" height="24" rx="1"/></g></g>
  </g>

  <g mask="url(#hd-fade)">
    <path class="hd-wv hd-w1" stroke="url(#hd-wa)" stroke-width="2" stroke-opacity=".55" d="M-400 192Q-300 176 -200 192T0 192T200 192T400 192T600 192T800 192T1000 192T1200 192"/>
    <path class="hd-wv hd-w2" stroke="url(#hd-wb)" stroke-width="1.5" stroke-opacity=".4" d="M-400 202Q-300 218 -200 202T0 202T200 202T400 202T600 202T800 202T1000 202T1200 202"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>